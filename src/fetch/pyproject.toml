[project]
name = "mcp-server-fetch"
version = "2026.10.28+fork.1"
description = "A Model Context Protocol server providing tools to fetch and convert web content for usage by LLMs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anthropic, PBC." }]
keywords = ["http", "mcp", "llm", "automation"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "anyio>=4.16.0",
    "beautifulsoup4>=4.15.0",
    "httpcore>=1.0.9,<2",
    "httpx[socks]>=0.28.1,<0.29",
    "markdownify>=1.2.3",
    "mcp>=2.3,<3",
    "protego>=0.7.0",
    "pydantic>=2.14.2",
    "readabilipy>=0.3.0",
]

[project.urls]
Upstream = "https://github.com/modelcontextprotocol/servers/tree/main/src/fetch"

[project.scripts]
mcp-server-fetch = "mcp_server_fetch:main"

[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "CONTRIBUTING.md", "conftest.py", "LICENSE", "pyproject.toml", "uv.lock"]
exclude = ["**/.*", "**/__pycache__", "**/*.py[cod]", "**/*.key", "**/*.pem", "**/*.p12", "**/*.pfx"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_fetch"]
exclude = ["**/.*", "**/__pycache__", "**/*.py[cod]", "**/*.key", "**/*.pem", "**/*.p12", "**/*.pfx"]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "pyright>=1.1.405",
    "ruff>=0.8.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.14",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests", "ci"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "node: needs Node.js on PATH and provisioned Readability.js deps (scripts/provision_node_deps.py); deselect with -m 'not node'",
]
filterwarnings = [
    "error",
    "ignore:Call to deprecated method findAll:DeprecationWarning:readabilipy",
]

[tool.ruff]
respect-gitignore = false
extend-exclude = [".audit", ".private", "**/.*", "build", "dist", "node_modules"]

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
include = ["src", "tests", "ci", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "build", "dist"]

[tool.coverage.run]
branch = true
source = ["src/mcp_server_fetch"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
